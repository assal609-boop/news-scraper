<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تفريغ روابط فيسبوك</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            font-family: 'Tajawal', sans-serif;
            background: #f4f6f9;
            padding: 30px 15px;
        }

        .main-card {
            max-width: 850px;
            margin: auto;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,.07);
        }

        .title {
            font-weight: 800;
            color: #212529;
        }

        .subtitle {
            color: #6c757d;
        }

        textarea {
            resize: vertical;
        }

        .extract-btn {
            height: 52px;
            font-size: 18px;
            font-weight: 700;
        }

        .result-card {
            background: #fff;
            border: 1px solid #e4e7eb;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .page-name {
            font-size: 18px;
            font-weight: 800;
            color: #0d6efd;
        }

        .post-text {
            margin-top: 10px;
            line-height: 1.9;
            color: #333;
            white-space: pre-wrap;
        }

        .url {
            font-size: 12px;
            color: #777;
            word-break: break-all;
            margin-top: 10px;
        }

        .status {
            font-weight: 700;
        }

        .success {
            color: #198754;
        }

        .error {
            color: #dc3545;
        }

        .copy-btn {
            margin-top: 12px;
        }

        #loading {
            display: none;
        }

    </style>

</head>

<body>

<div class="main-card">

    <div class="text-center mb-4">

        <h2 class="title">
            📄 تفريغ روابط فيسبوك
        </h2>

        <p class="subtitle mb-0">
            ضع روابط المنشورات، وسيحاول النظام استخراج اسم الصفحة ونص المنشور تلقائيًا.
        </p>

    </div>


    <div class="mb-3">

        <label class="form-label fw-bold">
            روابط فيسبوك
        </label>

        <textarea
            id="linksInput"
            class="form-control"
            rows="6"
            placeholder="ضع كل رابط في سطر منفصل..."
        ></textarea>

    </div>


    <button
        id="extractBtn"
        class="btn btn-primary w-100 extract-btn"
        onclick="extractLinks()"
    >
        🔎 تفريغ الروابط
    </button>


    <div
        id="loading"
        class="text-center mt-4"
    >
        <div
            class="spinner-border text-primary"
            role="status"
        ></div>

        <div class="mt-2 fw-bold">
            جارٍ قراءة الروابط...
        </div>
    </div>


    <div
        id="results"
        class="mt-4"
    ></div>


    <button
        id="copyAllBtn"
        class="btn btn-outline-success w-100 copy-btn"
        style="display:none"
        onclick="copyAll()"
    >
        📋 نسخ جميع النتائج
    </button>

</div>


<script>

let extractedResults = [];


async function extractLinks() {

    const input =
        document.getElementById("linksInput");

    const links =
        input.value.trim();

    if (!links) {

        alert("الرجاء إدخال رابط واحد على الأقل.");

        return;
    }


    const loading =
        document.getElementById("loading");

    const results =
        document.getElementById("results");

    const button =
        document.getElementById("extractBtn");

    const copyButton =
        document.getElementById("copyAllBtn");


    loading.style.display = "block";

    results.innerHTML = "";

    copyButton.style.display = "none";

    button.disabled = true;

    extractedResults = [];


    try {

        const response =
            await fetch("/extract", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    urls: links
                })

            });


        const data =
            await response.json();


        if (data.status !== "success") {

            throw new Error(
                data.message ||
                "حدث خطأ."
            );

        }


        extractedResults =
            data.results || [];


        displayResults(
            extractedResults
        );


        if (extractedResults.length) {
            copyButton.style.display =
                "block";
        }


    } catch (error) {

        results.innerHTML = `
            <div class="alert alert-danger">
                ❌ ${escapeHtml(error.message)}
            </div>
        `;

    } finally {

        loading.style.display = "none";

        button.disabled = false;

    }

}


function displayResults(results) {

    const container =
        document.getElementById("results");

    container.innerHTML = "";


    results.forEach((item, index) => {

        const card =
            document.createElement("div");

        card.className =
            "result-card";


        if (item.success) {

            card.innerHTML = `

                <div class="status success">
                    ✅ تم استخراج الرابط ${index + 1}
                </div>

                <div class="page-name mt-2">
                    ${escapeHtml(
                        item.page_name ||
                        "اسم الصفحة غير متوفر"
                    )}
                </div>

                <div class="post-text">
                    ${escapeHtml(
                        item.post_text ||
                        "نص المنشور غير متوفر"
                    )}
                </div>

                <div class="url">
                    🔗 ${escapeHtml(item.post_url)}
                </div>

            `;

        } else {

            card.innerHTML = `

                <div class="status error">
                    ❌ تعذر استخراج الرابط ${index + 1}
                </div>

                <div class="mt-2">
                    ${escapeHtml(
                        item.message ||
                        "المحتوى غير متوفر."
                    )}
                </div>

                <div class="url">
                    🔗 ${escapeHtml(item.post_url)}
                </div>

            `;

        }


        container.appendChild(card);

    });

}


function copyAll() {

    if (!extractedResults.length) {

        alert("لا توجد نتائج لنسخها.");

        return;
    }


    const text =
        extractedResults
            .map(item => {

                return (
                    (item.page_name || "اسم الصفحة غير متوفر")
                    + " : "
                    + (item.post_text || "نص المنشور غير متوفر")
                );

            })
            .join("\n\n");


    navigator.clipboard
        .writeText(text)
        .then(() => {

            alert(
                "✅ تم نسخ جميع النتائج."
            );

        })
        .catch(() => {

            alert(
                "تعذر النسخ تلقائيًا."
            );

        });

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;
}

</script>

</body>

</html>

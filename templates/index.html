<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تفريغ الروابط</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f4f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .main-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 800px;
            padding: 35px;
            border: 1px solid #eef2f5;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f4f8;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        .app-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-icon {
            background-color: #2563eb;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .badge-status {
            background-color: #e6f4ea;
            color: #137333;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .results-box {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 25px;
            background-color: #ffffff;
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px dashed #e5e7eb;
            padding-bottom: 15px;
        }
        .post-item {
            padding: 15px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 16px;
            line-height: 1.7;
        }
        .post-item:last-child {
            border-bottom: none;
        }
        .page-link {
            color: #2563eb;
            font-weight: 700;
            text-decoration: underline;
            font-size: 17px;
        }
        .page-link:hover {
            color: #1d4ed8;
        }
        .post-text {
            color: #374151;
            font-weight: 500;
        }
        .btn-custom {
            background-color: #2563eb;
            color: white;
            border-radius: 8px;
            padding: 10px 24px;
            font-weight: 600;
            border: none;
        }
        .btn-custom:hover {
            background-color: #1d4ed8;
            color: white;
        }
        .btn-light-custom {
            background-color: #f3f4f6;
            color: #4b5563;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            border: none;
        }
    </style>
</head>
<body>

<div class="main-card">
    <!-- Header -->
    <div class="app-header">
        <div class="app-title-group">
            <div class="app-icon">🔗</div>
            <div>
                <h4 class="m-0 fw-bold">تطبيق تفريغ الروابط</h4>
                <small class="text-muted">نظام استخراج وتحليل محتوى المنشورات الإخبارية</small>
            </div>
        </div>
        <span class="badge-status">● جاهز للاستخراج</span>
    </div>

    <!-- Input Section -->
    <div id="inputSection">
        <div class="mb-3">
            <label class="form-label fw-bold">أدخل رابط المنشور الإخباري:</label>
            <input type="url" id="urlInput" class="form-control form-control-lg" placeholder="https://www.facebook.com/..." required>
        </div>
        <button class="btn btn-custom w-100 py-2 mb-4" onclick="processExtract()">استخراج وتفريغ المحتوى</button>
    </div>

    <!-- Results Section -->
    <div class="results-box">
        <div class="results-header">
            <h5 class="fw-bold m-0 text-primary">📊 نتائج التفريغ</h5>
            <button class="btn btn-light-custom btn-sm" onclick="copyResults()">📋 نسخ النتائج</button>
        </div>

        <div id="resultsList">
            <!-- ستظهر النتائج هنا بتنسيق الصورة -->
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
            <button class="btn btn-light-custom btn-sm" onclick="clearAll()">➔ العودة لإدخال روابط جديدة</button>
            <small class="text-muted" id="totalCount">إجمالي الروابط المفرغة: 0 روابط</small>
        </div>
    </div>
</div>

<script>
    let extractedData = [];

    async function processExtract() {
        const urlInput = document.getElementById('urlInput');
        const url = urlInput.value.trim();

        if (!url) {
            alert('يرجى إدخال الرابط أولاً');
            return;
        }

        try {
            const res = await fetch('/extract', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await res.json();

            if (data.status === 'success') {
                extractedData.push(data);
                renderResults();
                urlInput.value = '';
            } else {
                alert(data.message || 'حدث خطأ أثناء التفريغ.');
            }
        } catch (err) {
            alert('تعذر الاتصال بالسيرفر.');
        }
    }

    function renderResults() {
        const listDiv = document.getElementById('resultsList');
        listDiv.innerHTML = '';

        extractedData.forEach(item => {
            const row = document.createElement('div');
            row.className = 'post-item';
            row.innerHTML = `<a href="${item.post_url}" target="_blank" class="page-link">${item.page_name}</a> : <span class="post-text">${item.post_text}</span>`;
            listDiv.appendChild(row);
        });

        document.getElementById('totalCount').innerText = `إجمالي الروابط المفرغة: ${extractedData.length} روابط`;
    }

    function copyResults() {
        if (extractedData.length === 0) return;
        let textToCopy = extractedData.map(item => `${item.page_name} : ${item.post_text}`).join('\n');
        navigator.clipboard.writeText(textToCopy);
        alert('تم نسخ جميع النتائج بنجاح!');
    }

    function clearAll() {
        extractedData = [];
        renderResults();
    }
</script>

</body>
</html>

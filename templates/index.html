<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تفريغ منشورات السوشيال ميديا</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f5f6f8;
    color:#111827;
}

.container{
    width:min(1000px,94%);
    margin:25px auto;
}

/* العنوان */

.header{
    background:#ffffff;
    border:1px solid #e5e7eb;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

.header h1{
    margin:0;
    font-size:22px;
    color:#111827;
}

.header p{
    margin:7px 0 0;
    color:#6b7280;
    font-size:13px;
}

/* صندوق الروابط */

.input-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.input-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

.input-row{
    display:flex;
    gap:8px;
    align-items:stretch;
}

textarea{
    flex:1;
    height:75px;
    resize:none;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:10px;
    font-size:13px;
    direction:ltr;
    text-align:left;
    outline:none;
}

textarea:focus{
    border-color:#1e3a8a;
}

.extract-btn{
    width:145px;
    border:0;
    border-radius:8px;
    background:#1e3a8a;
    color:white;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.extract-btn:hover{
    background:#172554;
}

.extract-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* الخيارات */

.options{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
    gap:10px;
}

.option-text{
    font-size:12px;
    color:#6b7280;
}

.copy-btn{
    border:1px solid #d1d5db;
    background:#fff;
    color:#374151;
    border-radius:7px;
    padding:7px 12px;
    font-size:12px;
    cursor:pointer;
}

.copy-btn:hover{
    background:#f3f4f6;
}

/* الحالة */

#status{
    display:none;
    margin-top:10px;
    padding:9px 12px;
    border-radius:7px;
    font-size:12px;
    text-align:center;
}

.loading{
    display:block!important;
    background:#eff6ff;
    color:#1d4ed8;
}

.error{
    display:block!important;
    background:#fef2f2;
    color:#b91c1c;
}

.success{
    display:block!important;
    background:#f0fdf4;
    color:#15803d;
}

/* النتائج */

.results-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
}

.results-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.results-title{
    font-size:15px;
    font-weight:bold;
}

/* الفلاتر */

.filters{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.filter-btn{
    border:1px solid #d1d5db;
    background:#fff;
    color:#4b5563;
    border-radius:6px;
    padding:5px 10px;
    font-size:11px;
    cursor:pointer;
}

.filter-btn:hover{
    background:#f3f4f6;
}

.filter-btn.active{
    background:#1e3a8a;
    color:#fff;
    border-color:#1e3a8a;
}

/* قائمة النتائج */

#results{
    display:flex;
    flex-direction:column;
    gap:7px;
}

/* المنشور */

.result{
    border-bottom:1px solid #eeeeee;
    padding:8px 4px;
    font-size:13px;
    line-height:1.8;
}

.result:last-child{
    border-bottom:none;
}

/* السطر الرئيسي */

.result-line{
    display:block;
}

/* رقم المنشور */

.number{
    display:inline-block;
    color:#9ca3af;
    font-size:11px;
    margin-left:5px;
}

/* اسم الصفحة */

.page-link{
    color:#0b2a6f;
    font-weight:bold;
    text-decoration:none;
    font-size:13px;
}

.page-link:hover{
    color:#061b4a;
    text-decoration:underline;
}

/* : */

.separator{
    color:#555;
    margin:0 3px;
}

/* نص المنشور */

.post-inline{
    color:#111111;
    font-size:13px;
    white-space:pre-wrap;
}

/* المنصة */

.platform{
    display:inline-block;
    margin-right:8px;
    padding:2px 6px;
    border-radius:4px;
    background:#f1f5f9;
    color:#64748b;
    font-size:9px;
    vertical-align:middle;
}

/* المنشور الفاشل */

.failed{
    color:#b91c1c;
    font-size:13px;
}

.failed .number{
    color:#b91c1c;
}

/* لا توجد نتائج */

.empty{
    text-align:center;
    color:#9ca3af;
    padding:30px 10px;
    font-size:13px;
}

/* الجوال */

@media(max-width:700px){

    .container{
        width:96%;
        margin:15px auto;
    }

    .input-row{
        flex-direction:column;
    }

    textarea{
        width:100%;
        height:100px;
    }

    .extract-btn{
        width:100%;
        height:40px;
    }

    .results-top{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }

    .options{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>
</head>


<body>

<div class="container">

    <!-- العنوان -->

    <div class="header">

        <h1>📱 تفريغ منشورات السوشيال ميديا</h1>

        <p>
            استخراج نص المنشورات من Facebook و Instagram و X / Twitter
        </p>

    </div>


    <!-- إدخال الروابط -->

    <div class="input-card">

        <div class="input-title">
            🔗 روابط المنشورات
        </div>

        <div class="input-row">

            <textarea
                id="links"
                placeholder="ضع كل رابط في سطر منفصل..."
            ></textarea>

            <button
                id="extractBtn"
                class="extract-btn"
                onclick="extractPosts()"
            >
                🔎 استخراج
            </button>

        </div>


        <div class="options">

            <div class="option-text">
                يمكنك إدخال أكثر من رابط في نفس الوقت.
            </div>

            <button
                class="copy-btn"
                onclick="copyAll()"
            >
                📋 نسخ النتائج
            </button>

        </div>


        <div id="status"></div>

    </div>


    <!-- النتائج -->

    <div class="results-card">

        <div class="results-top">

            <div class="results-title">
                📋 النتائج
                <span id="count"></span>
            </div>


            <!-- الفلاتر -->

            <div class="filters">

                <button
                    class="filter-btn active"
                    data-filter="all"
                    onclick="filterResults('all',this)"
                >
                    الكل
                </button>

                <button
                    class="filter-btn"
                    data-filter="Facebook"
                    onclick="filterResults('Facebook',this)"
                >
                    Facebook
                </button>

                <button
                    class="filter-btn"
                    data-filter="Instagram"
                    onclick="filterResults('Instagram',this)"
                >
                    Instagram
                </button>

                <button
                    class="filter-btn"
                    data-filter="X / Twitter"
                    onclick="filterResults('X / Twitter',this)"
                >
                    X / Twitter
                </button>

            </div>

        </div>


        <div id="results">

            <div class="empty">
                لم يتم استخراج أي منشورات بعد.
            </div>

        </div>

    </div>

</div>


<script>

let currentResults = [];

let currentFilter = "all";


/* حماية النص من HTML */

function escapeHTML(text){

    if(text === null || text === undefined){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* عرض رسالة */

function showStatus(message,type){

    const status = document.getElementById("status");

    status.className = type;

    status.textContent = message;
}


/* استخراج المنشورات */

async function extractPosts(){

    const textarea =
        document.getElementById("links");

    const button =
        document.getElementById("extractBtn");

    const resultsBox =
        document.getElementById("results");

    const raw =
        textarea.value.trim();


    if(!raw){

        showStatus(
            "⚠️ ضع رابطًا واحدًا على الأقل.",
            "error"
        );

        return;
    }


    const links =
        raw
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(x => x.length > 0);


    button.disabled = true;

    button.textContent = "⏳ جاري...";


    resultsBox.innerHTML = "";

    showStatus(
        "⏳ جاري استخراج المنشورات...",
        "loading"
    );


    try{

        const response = await fetch(
            "/extract",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    urls:links.join("\n")
                })
            }
        );


        const data =
            await response.json();


        if(
            !response.ok ||
            data.status !== "success"
        ){

            throw new Error(
                data.message ||
                "حدث خطأ أثناء الاستخراج."
            );

        }


        currentResults =
            data.results || [];


        currentFilter = "all";


        document
            .querySelectorAll(".filter-btn")
            .forEach(btn => {

                btn.classList.remove("active");

            });


        document
            .querySelector('[data-filter="all"]')
            .classList.add("active");


        document.getElementById("count")
            .textContent =
            ` (${currentResults.length})`;


        renderResults();


        showStatus(
            `✅ تم استخراج ${currentResults.length} نتيجة.`,
            "success"
        );


    }catch(error){

        currentResults = [];

        resultsBox.innerHTML =
            `<div class="empty">
                ❌ ${escapeHTML(error.message)}
            </div>`;


        showStatus(
            "❌ " + error.message,
            "error"
        );

    }


    finally{

        button.disabled = false;

        button.textContent = "🔎 استخراج";

    }

}


/* عرض النتائج */

function renderResults(){

    const resultsBox =
        document.getElementById("results");


    let filteredResults =
        currentResults;


    if(currentFilter !== "all"){

        filteredResults =
            currentResults.filter(
                item =>
                    item.platform === currentFilter
            );

    }


    if(!filteredResults.length){

        resultsBox.innerHTML =
            `<div class="empty">
                لا توجد منشورات في هذا القسم.
            </div>`;

        return;
    }


    resultsBox.innerHTML = "";


    filteredResults.forEach(
        (item,index) => {


            const div =
                document.createElement("div");


            if(item.success){

                div.className =
                    "result";


                div.innerHTML = `

                    <div class="result-line">

                        <span class="number">
                            ${index + 1}.
                        </span>

                        <a
                            class="page-link"
                            href="${escapeHTML(item.post_url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ${escapeHTML(item.page_name)}
                        </a>

                        <span class="separator">:</span>

                        <span class="post-inline">
                            ${escapeHTML(
                                item.post_text ||
                                "لا يوجد نص منشور ظاهر."
                            )}
                        </span>

                        <span class="platform">
                            ${escapeHTML(item.platform)}
                        </span>

                    </div>

                `;

            }

            else{

                div.className =
                    "result failed";


                div.innerHTML = `

                    <div class="result-line">

                        <span class="number">
                            ${index + 1}.
                        </span>

                        ❌ الرابط غير صالح

                    </div>

                `;

            }


            resultsBox.appendChild(div);

        }
    );

}


/* الفلاتر */

function filterResults(
    filter,
    button
){

    currentFilter = filter;


    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    renderResults();

}


/* نسخ النتائج */

async function copyAll(){

    if(!currentResults.length){

        showStatus(
            "⚠️ استخرج النتائج أولًا.",
            "error"
        );

        return;
    }


    let output = "";


    currentResults.forEach(
        item => {

            if(item.success){

                output +=
                    `${item.page_name || "غير متوفر"} : ${item.post_text || "غير متوفر"}\n`;

            }

            else{

                output +=
                    `الرابط غير صالح\n`;

            }

        }
    );


    try{

        await navigator.clipboard.writeText(
            output
        );


        showStatus(
            "✅ تم نسخ النتائج.",
            "success"
        );


    }catch(e){

        showStatus(
            "❌ تعذر النسخ.",
            "error"
        );

    }

}

</script>

</body>

</html>

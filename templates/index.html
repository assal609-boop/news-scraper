<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>📱 تفريغ منشورات السوشيال ميديا</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background: linear-gradient(135deg, #f7f8ff, #eef1ff);
            color: #222;
        }

        .container {
            width: min(1100px, 94%);
            margin: 40px auto;
        }

        .header {
            background: white;
            border-radius: 24px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            margin-bottom: 22px;
        }

        .header-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 30px;
            color: #252a5c;
        }

        .subtitle {
            margin: 0;
            color: #777;
            font-size: 15px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.07);
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        textarea {
            width: 100%;
            min-height: 190px;
            resize: vertical;
            border: 2px solid #e3e5f2;
            border-radius: 16px;
            padding: 17px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
            direction: ltr;
            text-align: left;
        }

        textarea:focus {
            border-color: #656bd6;
            box-shadow: 0 0 0 4px rgba(101, 107, 214, 0.1);
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            background: #5c63d8;
            color: white;
            transition: 0.2s;
            width: 100%;
        }

        button:hover {
            background: #4d54c5;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            background: #f0f2ff;
            color: #454a9a;
        }

        .results-card {
            display: none;
        }

        .results-title {
            margin-bottom: 18px;
        }

        .results-title h2 {
            margin: 0;
            color: #252a5c;
            font-size: 21px;
        }

        .result-item {
            border: 1px solid #e8e9f2;
            border-radius: 17px;
            padding: 18px;
            margin-bottom: 12px;
            background: #fff;
            transition: 0.2s;
        }

        .result-item:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }

        .result-line {
            line-height: 1.9;
            font-size: 16px;
            word-break: break-word;
        }

        .page-link {
            color: #1769e0;
            font-weight: bold;
            text-decoration: none;
        }

        .page-link:hover {
            text-decoration: underline;
        }

        .post-text {
            color: #222;
            white-space: pre-wrap;
        }

        .error-message {
            margin-top: 10px;
            color: #b42318;
            background: #fff1f0;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            padding: 35px 15px;
            color: #777;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 13px;
            padding: 10px 0 30px;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .header {
                padding: 24px 17px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .card {
                padding: 18px;
                border-radius: 20px;
            }

            textarea {
                min-height: 160px;
            }

            .result-line {
                font-size: 15px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="header-icon">
            📱
        </div>

        <h1>
            تفريغ منشورات السوشيال ميديا
        </h1>

        <p class="subtitle">
            استخرج اسم الحساب ونص المنشور من Facebook وInstagram وX
        </p>

    </div>


    <div class="card">

        <label for="urls">
            🔗 أدخل الروابط
        </label>

        <textarea
            id="urls"
            placeholder="ضع كل رابط في سطر منفصل...

مثال:
https://www.facebook.com/...
https://www.instagram.com/...
https://x.com/..."></textarea>


        <div class="controls">

            <button id="extractButton" onclick="extractPosts()">
                🚀 استخراج المنشورات
            </button>

        </div>


        <div id="status" class="status"></div>

    </div>


    <div id="resultsCard" class="card results-card">

        <div class="results-title">

            <h2>
                📋 النتائج
            </h2>

        </div>

        <div id="results"></div>

    </div>


    <div class="footer">
        أداة تفريغ المنشورات من منصات التواصل الاجتماعي
    </div>

</div>


<script>

const urlsInput = document.getElementById("urls");

const button = document.getElementById("extractButton");

const statusBox = document.getElementById("status");

const resultsCard = document.getElementById("resultsCard");

const resultsBox = document.getElementById("results");


function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function safeURL(url) {

    if (!url) {
        return "#";
    }

    const value = String(url).trim();

    if (
        value.startsWith("https://") ||
        value.startsWith("http://")
    ) {
        return value;
    }

    return "#";
}


async function extractPosts() {

    const rawText = urlsInput.value.trim();

    if (!rawText) {

        showStatus(
            "⚠️ أدخل رابطًا واحدًا على الأقل.",
            true
        );

        return;
    }


    const urls = rawText
        .split(/\r?\n/)
        .map(url => url.trim())
        .filter(Boolean);


    button.disabled = true;

    button.textContent = "⏳ جاري الاستخراج...";


    showStatus(
        "⏳ جاري استخراج المنشورات، يرجى الانتظار..."
    );


    resultsCard.style.display = "none";

    resultsBox.innerHTML = "";


    try {

        const response = await fetch("/extract", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                urls: urls
            })

        });


        const data = await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "حدث خطأ أثناء استخراج المنشورات."
            );
        }


        renderResults(data.results || []);

        hideStatus();


    } catch (error) {

        showStatus(
            "❌ " +
            (error.message ||
            "حدث خطأ غير متوقع."),
            true
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "🚀 استخراج المنشورات";

    }

}


function renderResults(items) {

    resultsCard.style.display = "block";


    if (!items.length) {

        resultsBox.innerHTML = `
            <div class="empty">
                لا توجد نتائج لعرضها.
            </div>
        `;

        return;
    }


    resultsBox.innerHTML = items.map(item => {

        const pageName = escapeHTML(
            item.page_name ||
            "الحساب غير معروف"
        );


        const postText = escapeHTML(
            item.post_text ||
            "لا يوجد نص منشور ظاهر."
        );


        const postURL = safeURL(
            item.post_url
        );


        let errorHTML = "";


        if (item.error) {

            errorHTML = `
                <div class="error-message">
                    ⚠️ ${escapeHTML(item.error)}
                </div>
            `;

        }


        return `
            <div class="result-item">

                <div class="result-line">

                    <a
                        class="page-link"
                        href="${postURL}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >${pageName}</a>:<span class="post-text">${postText}</span>

                </div>

                ${errorHTML}

            </div>
        `;

    }).join("");

}


function showStatus(message, isError = false) {

    statusBox.textContent = message;

    statusBox.style.display = "block";

    statusBox.style.background =
        isError
            ? "#fff1f0"
            : "#f0f2ff";

    statusBox.style.color =
        isError
            ? "#b42318"
            : "#454a9a";
}


function hideStatus() {

    statusBox.style.display = "none";

}

</script>

</body>
</html>

<body>

<div class="container">

    <!-- Header -->
    <div class="header">

        <div class="header-icon">
            📱
        </div>

        <h1>
            تفريغ منشورات السوشيال ميديا
        </h1>

        <p class="subtitle">
            استخرج اسم الحساب ونص المنشور من Facebook وInstagram وX
        </p>

    </div>


    <!-- Input -->
    <div class="card">

        <label for="urls">
            🔗 أدخل الروابط
        </label>

        <textarea
            id="urls"
            placeholder="ضع كل رابط في سطر منفصل...

مثال:
https://www.facebook.com/...
https://www.instagram.com/...
https://x.com/..."
        ></textarea>


        <div class="controls">

            <select id="platformFilter">

                <option value="all">
                    جميع المنصات
                </option>

                <option value="Facebook">
                    Facebook
                </option>

                <option value="Instagram">
                    Instagram
                </option>

                <option value="X / Twitter">
                    X / Twitter
                </option>

            </select>


            <button
                id="extractButton"
                onclick="extractPosts()">

                🚀 استخراج المنشورات

            </button>

        </div>


        <div
            id="status"
            class="status">
        </div>

    </div>


    <!-- Results -->
    <div
        id="resultsCard"
        class="card results-card">

        <div class="results-title">

            <h2>
                📋 النتائج
            </h2>

            <span
                id="resultCount"
                class="count">
                0
            </span>

        </div>


        <div id="results"></div>

    </div>


    <div class="footer">
        أداة تفريغ المنشورات من منصات التواصل الاجتماعي
    </div>

</div>


<script>

    const urlsInput =
        document.getElementById("urls");

    const filter =
        document.getElementById("platformFilter");

    const button =
        document.getElementById("extractButton");

    const statusBox =
        document.getElementById("status");

    const resultsCard =
        document.getElementById("resultsCard");

    const resultsBox =
        document.getElementById("results");

    const resultCount =
        document.getElementById("resultCount");


    // -----------------------------------------
    // حماية النص من HTML
    // -----------------------------------------
    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // -----------------------------------------
    // تنظيف الرابط قبل عرضه
    // -----------------------------------------
    function safeURL(url) {

        if (!url) {
            return "#";
        }

        const value = String(url).trim();

        if (
            value.startsWith("https://") ||
            value.startsWith("http://")
        ) {
            return value;
        }

        return "#";
    }


    // -----------------------------------------
    // استخراج المنشورات
    // -----------------------------------------
    async function extractPosts() {

        const rawText =
            urlsInput.value.trim();

        if (!rawText) {

            showStatus(
                "⚠️ أدخل رابطًا واحدًا على الأقل.",
                true
            );

            return;
        }


        const urls = rawText
            .split(/\r?\n/)
            .map(url => url.trim())
            .filter(Boolean);


        button.disabled = true;

        button.textContent =
            "⏳ جاري الاستخراج...";


        showStatus(
            "⏳ جاري استخراج المنشورات، يرجى الانتظار..."
        );


        resultsCard.style.display =
            "none";

        resultsBox.innerHTML = "";


        try {

            const response =
                await fetch("/extract", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        urls: urls
                    })

                });


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.error ||
                    "حدث خطأ أثناء استخراج المنشورات."
                );
            }


            renderResults(
                data.results || []
            );


            hideStatus();


        } catch (error) {

            showStatus(
                "❌ " +
                (error.message ||
                 "حدث خطأ غير متوقع."),
                true
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "🚀 استخراج المنشورات";
        }
    }


    // -----------------------------------------
    // عرض النتائج
    // -----------------------------------------
    function renderResults(items) {

        const selectedPlatform =
            filter.value;


        let filtered =
            items.filter(item => {

                if (selectedPlatform === "all") {
                    return true;
                }

                return item.platform ===
                    selectedPlatform;
            });


        resultCount.textContent =
            filtered.length;


        resultsCard.style.display =
            "block";


        if (!filtered.length) {

            resultsBox.innerHTML = `
                <div class="empty">
                    لا توجد نتائج لعرضها.
                </div>
            `;

            return;
        }


        resultsBox.innerHTML =
            filtered.map(item => {

                const pageName =
                    escapeHTML(
                        item.page_name ||
                        "الحساب غير معروف"
                    );


                const postText =
                    escapeHTML(
                        item.post_text ||
                        "لا يوجد نص منشور ظاهر."
                    );


                const postURL =
                    safeURL(
                        item.post_url
                    );


                const platform =
                    escapeHTML(
                        item.platform ||
                        ""
                    );


                let errorHTML = "";


                if (item.error) {

                    errorHTML = `
                        <div class="error-message">
                            ⚠️ ${escapeHTML(item.error)}
                        </div>
                    `;
                }


                return `
                    <div class="result-item">

                        <div class="result-line">

                            <a
                                class="page-link"
                                href="${postURL}"
                                target="_blank"
                                rel="noopener noreferrer">

                                ${pageName}

                            </a>

                            :

                            <span class="post-text">
                                ${postText}
                            </span>

                        </div>


                        <span class="platform">
                            ${platform}
                        </span>

                        ${errorHTML}

                    </div>
                `;

            }).join("");
    }


    // -----------------------------------------
    // الفلتر
    // -----------------------------------------
    filter.addEventListener(
        "change",
        function() {

            const currentResults =
                window.lastResults || [];

            renderResults(
                currentResults
            );

        }
    );


    // حفظ النتائج للفلترة
    const originalRenderResults =
        renderResults;


    window.lastResults = [];


    function saveResults(items) {

        window.lastResults =
            items || [];

        originalRenderResults(
            window.lastResults
        );
    }


    // -----------------------------------------
    // Status
    // -----------------------------------------
    function showStatus(
        message,
        isError = false
    ) {

        statusBox.textContent =
            message;

        statusBox.style.display =
            "block";

        statusBox.style.background =
            isError
                ? "#fff1f0"
                : "#f0f2ff";

        statusBox.style.color =
            isError
                ? "#b42318"
                : "#454a9a";
    }


    function hideStatus() {

        statusBox.style.display =
            "none";
    }


    // -----------------------------------------
    // تعديل renderResults لحفظ النتائج
    // -----------------------------------------
    const originalExtractPosts =
        extractPosts;


    // اعتراض النتيجة من الـ API
    async function extractAndSave() {

        await originalExtractPosts();

    }


    // -----------------------------------------
    // إعادة تعريف الاستخراج مع حفظ النتائج
    // -----------------------------------------
    extractPosts = async function() {

        const rawText =
            urlsInput.value.trim();


        if (!rawText) {

            showStatus(
                "⚠️ أدخل رابطًا واحدًا على الأقل.",
                true
            );

            return;
        }


        const urls = rawText
            .split(/\r?\n/)
            .map(url => url.trim())
            .filter(Boolean);


        button.disabled = true;

        button.textContent =
            "⏳ جاري الاستخراج...";


        showStatus(
            "⏳ جاري استخراج المنشورات، يرجى الانتظار..."
        );


        resultsCard.style.display =
            "none";


        try {

            const response =
                await fetch("/extract", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        urls: urls
                    })

                });


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.error ||
                    "حدث خطأ أثناء استخراج المنشورات."
                );
            }


            window.lastResults =
                data.results || [];


            originalRenderResults(
                window.lastResults
            );


            hideStatus();


        } catch (error) {

            showStatus(
                "❌ " +
                (error.message ||
                 "حدث خطأ غير متوقع."),
                true
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "🚀 استخراج المنشورات";
        }
    };

</script>

</body>
</html>
```

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تفريغ منشورات السوشيال ميديا</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Tahoma, sans-serif;
    background:#f3f5f7;
    color:#111827;
}

/* الصفحة */

.container{
    width:min(1200px, 94%);
    margin:25px auto 50px;
}

/* الهيدر */

.header{
    background:#ffffff;
    border-radius:14px;
    padding:18px 28px;
    margin-bottom:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:21px;
    font-weight:bold;
    color:#173f68;
}

.nav{
    display:flex;
    gap:35px;
    font-size:16px;
    font-weight:bold;
}

.nav span{
    color:#222;
    cursor:pointer;
}

.nav span:hover{
    color:#24577f;
}

/* منطقة الإدخال */

.input-card{
    background:#fff;
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.tools{
    display:flex;
    gap:8px;
    align-items:center;
}

textarea{
    flex:1;
    height:43px;
    min-height:43px;
    resize:none;

    border:1px solid #d7dde3;
    border-radius:7px;

    padding:11px 13px;

    font-family:Arial,Tahoma,sans-serif;
    font-size:14px;

    outline:none;

    direction:ltr;
    text-align:left;

    background:#fff;
}

textarea:focus{
    border-color:#315f84;
    box-shadow:0 0 0 2px rgba(49,95,132,.08);
}

.filter{
    height:43px;
    border:1px solid #d7dde3;
    border-radius:7px;
    background:#fff;
    padding:0 15px;
    font-size:14px;
    color:#333;
}

.extract{
    height:43px;
    border:none;
    border-radius:7px;
    background:#315f84;
    color:#fff;
    padding:0 22px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

.extract:hover{
    background:#244b6a;
}

.extract:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* الحالة */

#status{
    display:none;
    margin-top:10px;
    padding:9px 12px;
    border-radius:7px;
    text-align:center;
    font-size:14px;
    font-weight:bold;
}

.loading{
    display:block!important;
    background:#eef5fa;
    color:#315f84;
}

.success{
    display:block!important;
    background:#edf8f1;
    color:#16733c;
}

.error{
    display:block!important;
    background:#fff0f0;
    color:#b42323;
}

/* النتائج */

.results-card{
    background:#fff;
    border-radius:12px;
    min-height:350px;
    padding:30px 45px;
    box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.results-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:25px;

    border-bottom:1px solid #edf0f2;
    padding-bottom:13px;
}

.results-title h2{
    margin:0;
    font-size:18px;
    color:#222;
}

#count{
    font-size:13px;
    color:#777;
}

/* السطور */

#results{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.result{
    font-size:22px;
    line-height:1.8;
    text-align:right;
}

/*
اسم الصفحة
*/

.page-link{
    color:#28577e;
    font-weight:bold;
    text-decoration:underline;

    cursor:pointer;
}

.page-link:hover{
    color:#173d5c;
}

/*
نص المنشور
*/

.post-text{
    color:#111;
    font-weight:bold;
    display:inline;
}

/* نقطتين بين الاسم والنص */

.separator{
    color:#111;
    font-weight:bold;
    margin:0 5px;
}

/* رقم النتيجة مخفي بالشكل النهائي */

.number{
    display:none;
}

/* المنصة لا تظهر بالشكل النهائي */

.platform{
    display:none;
}

/* نتيجة فاشلة */

.result.failed{
    color:#b42323;
    font-size:18px;
    font-weight:bold;
}

/* لا يوجد نتائج */

.empty{
    text-align:center;
    color:#777;
    padding:60px 20px;
    font-size:16px;
}

/* الموبايل */

@media(max-width:800px){

    .header{
        padding:15px;
        flex-direction:column;
        gap:14px;
    }

    .nav{
        gap:18px;
        font-size:14px;
    }

    .tools{
        flex-direction:column;
        align-items:stretch;
    }

    textarea{
        width:100%;
        height:80px;
    }

    .filter,
    .extract{
        width:100%;
    }

    .results-card{
        padding:22px 18px;
    }

    .result{
        font-size:18px;
        line-height:1.9;
    }

}

</style>

</head>


<body>

<div class="container">


    <!-- الهيدر -->

    <div class="header">

        <div class="logo">
            📱 تفريغ منشورات السوشيال ميديا
        </div>

        <div class="nav">

            <span>الرئيسية</span>

            <span>عن الموقع</span>

            <span>تواصل معنا</span>

        </div>

    </div>


    <!-- أدوات الإدخال -->

    <div class="input-card">

        <div class="tools">

            <textarea
                id="links"
                placeholder="ضع روابط المنشورات هنا، كل رابط في سطر..."
            ></textarea>


            <select
                id="filter"
                class="filter"
            >

                <option value="all">
                    جميع المنصات
                </option>

                <option value="Facebook">
                    Facebook
                </option>

                <option value="Instagram">
                    Instagram
                </option>

                <option value="X / Twitter">
                    X / Twitter
                </option>

            </select>


            <button
                id="extractBtn"
                class="extract"
                onclick="extractPosts()"
            >
                🔎 استخراج
            </button>

        </div>


        <div id="status"></div>

    </div>


    <!-- النتائج -->

    <div class="results-card">

        <div class="results-title">

            <h2>
                نتائج المنشورات
            </h2>

            <span id="count"></span>

        </div>


        <div id="results">

            <div class="empty">
                ضع روابط المنشورات ثم اضغط على «استخراج».
            </div>

        </div>

    </div>


</div>


<script>

let currentResults = [];


/* حماية النص */

function escapeHTML(text){

    if(
        text === null ||
        text === undefined
    ){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* عرض الحالة */

function showStatus(message,type){

    const status =
        document.getElementById("status");

    status.className = type;

    status.textContent = message;
}


/* عرض النتائج */

function renderResults(){

    const resultsBox =
        document.getElementById("results");

    const filter =
        document.getElementById("filter").value;


    let filtered =
        currentResults.filter(item => {

            if(filter === "all"){
                return true;
            }

            return item.platform === filter;

        });


    document
        .getElementById("count")
        .textContent =
        `${filtered.length} نتيجة`;


    if(!filtered.length){

        resultsBox.innerHTML = `
            <div class="empty">
                لا توجد نتائج مطابقة.
            </div>
        `;

        return;
    }


    resultsBox.innerHTML = "";


    filtered.forEach((item,index) => {

        const div =
            document.createElement("div");


        if(item.success){

            div.className = "result";


            const pageName =
                escapeHTML(
                    item.page_name ||
                    "الحساب غير معروف"
                );


            const postText =
                escapeHTML(
                    item.post_text ||
                    "لا يوجد نص منشور ظاهر."
                );


            const postUrl =
                escapeHTML(
                    item.post_url || "#"
                );


            div.innerHTML = `

                <a
                    class="page-link"
                    href="${postUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ${pageName}
                </a>

                <span class="separator">
                    :
                </span>

                <span class="post-text">
                    ${postText}
                </span>

            `;

        }

        else{

            div.className =
                "result failed";

            div.innerHTML = `
                ❌ الرابط غير صالح
            `;

        }


        resultsBox.appendChild(div);

    });

}


/* استخراج المنشورات */

async function extractPosts(){

    const textarea =
        document.getElementById("links");

    const button =
        document.getElementById("extractBtn");

    const resultsBox =
        document.getElementById("results");


    const raw =
        textarea.value.trim();


    if(!raw){

        showStatus(
            "⚠️ ضع رابطًا واحدًا على الأقل.",
            "error"
        );

        return;
    }


    const links =
        raw
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(x => x.length > 0);


    button.disabled = true;

    button.textContent =
        "⏳ جاري الاستخراج...";


    resultsBox.innerHTML = `
        <div class="empty">
            ⏳ جاري استخراج المنشورات...
        </div>
    `;


    showStatus(
        "⏳ جاري استخراج المنشورات...",
        "loading"
    );


    try{

        const response =
            await fetch(
                "/extract",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        urls:links.join("\n")
                    })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            data.status !== "success"
        ){

            throw new Error(
                data.message ||
                "حدث خطأ أثناء الاستخراج."
            );

        }


        currentResults =
            data.results || [];


        renderResults();


        showStatus(
            `✅ تم استخراج ${currentResults.length} نتيجة.`,
            "success"
        );


    }

    catch(error){

        currentResults = [];


        resultsBox.innerHTML = `
            <div class="empty">
                ❌ ${escapeHTML(error.message)}
            </div>
        `;


        document
            .getElementById("count")
            .textContent = "";


        showStatus(
            "❌ " + error.message,
            "error"
        );

    }


    finally{

        button.disabled = false;

        button.textContent =
            "🔎 استخراج";

    }

}


/* الفلتر */

document
    .getElementById("filter")
    .addEventListener(
        "change",
        renderResults
    );

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفريغ الروابط بدقة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8f9fa; padding: 25px; }
        .card { max-width: 800px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: #fff; }
        .row-box { background: #fdfdfe; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 12px; }
        .item-result { padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 16px; line-height: 1.8; }
        .page-link { color: #0d6efd; font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h4 class="fw-bold mb-2 text-center">أداة تفريغ الروابط الدقيقة</h4>
    <p class="text-muted text-center small mb-4">ضع الروابط لتظهر لك خانة لصق النص لكل رابط للحصول على دقة مطلقة.</p>
    
    <div class="mb-3">
        <label class="form-label fw-bold">الروابط (ضع كل رابط في سطر):</label>
        <textarea id="linksInput" class="form-control" rows="3" placeholder="https://..." oninput="buildFields()"></textarea>
    </div>

    <!-- خانات إدخال النص الدقيق لكل رابط -->
    <div id="dynamicInputs" class="mb-3"></div>
    
    <button class="btn btn-primary w-100 mb-4 fw-bold py-2" onclick="generateFinalOutput()">توليد الشكل النهائي للعميل</button>

    <div class="border rounded p-3 bg-light">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-bold text-success">النتائج الجاهزة للنسخ:</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="copyResults()">📋 نسخ النتائج</button>
        </div>
        <div id="outputArea" class="text-muted small">قم بإدخال الروابط والنصوص لتظهر النتيجة هنا...</div>
    </div>
</div>

<script>
    let activeLinks = [];

    function detectPageName(url) {
        let lower = url.toLowerCase();
        if (lower.includes('alfaisalyscjo')) return "النادي الفيصلي الأردني";
        if (lower.includes('sarahanews')) return "صراحة نيوز";
        if (lower.includes('radiohala')) return "راديو هالة";
        if (lower.includes('ammonnews')) return "عمون الإخبارية";
        if (lower.includes('royanews')) return "رؤيا الإخباري";
        if (lower.includes('alghad')) return "صحيفة الغد";
        if (lower.includes('facebook') || lower.includes('fb.watch') || lower.includes('share')) return "منشور فيسبوك";
        
        try {
            let d = new URL(url).hostname.replace('www.', '').split('.')[0];
            if (d) return d.charAt(0).toUpperCase() + d.slice(1);
        } catch(e) {}
        return "صفحة إخبارية";
    }

    function buildFields() {
        let text = document.getElementById('linksInput').value.trim();
        let container = document.getElementById('dynamicInputs');
        container.innerHTML = '';
        activeLinks = [];

        if (!text) return;

        let lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        activeLinks = lines;

        if (lines.length > 0) {
            let html = '<label class="form-label fw-bold small text-primary">الصق نص البوست الدقيق لكل رابط أدناه:</label>';
            lines.forEach((url, i) => {
                let pageName = detectPageName(url);
                html += `
                    <div class="row-box">
                        <div class="fw-bold text-dark small mb-1">🔗 الرابط ${i+1} (${pageName}):</div>
                        <textarea id="text_${i}" class="form-control form-control-sm" rows="2" placeholder="الصق نص المنشور الحقيقي هنا..."></textarea>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    }

    let finalCopyText = "";

    function generateFinalOutput() {
        if (activeLinks.length === 0) {
            alert('الرجاء إدخال روابط أولاً');
            return;
        }

        let output = document.getElementById('outputArea');
        output.innerHTML = '';
        let textLines = [];

        activeLinks.forEach((url, i) => {
            let pageName = detectPageName(url);
            let userText = document.getElementById(`text_${i}`).value.trim();
            if (!userText) userText = "نص المنشور غير متوفر";

            textLines.push(`${pageName} : ${userText}`);

            let div = document.createElement('div');
            div.className = 'item-result';
            div.innerHTML = `<a href="${url}" target="_blank" class="page-link">${pageName}</a> : <span>${userText}</span>`;
            output.appendChild(div);
        });

        finalCopyText = textLines.join('\n');
        alert('تم توليد النتائج بدقة تامة وجاهزة للنسخ!');
    }

    function copyResults() {
        if (!finalCopyText) {
            alert('الرجاء توليد النتائج أولاً');
            return;
        }
        navigator.clipboard.writeText(finalCopyText);
        alert('تم نسخ النتائج بنجاح إلى الحافظة!');
    }
</script>

</body>
</html>

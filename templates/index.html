<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة استخراج محتوى المنشورات الإخبارية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 700px;
            width: 100%;
        }
        h2 {
            color: #1877f2;
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="url"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        button {
            background-color: #1877f2;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #145dbf;
        }
        .feed-container {
            margin-top: 20px;
        }
        .post-card {
            background-color: #f1f3f5;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-right: 4px solid #1877f2;
            line-height: 1.6;
        }
        .page-link {
            color: #1877f2;
            font-weight: bold;
            text-decoration: none;
            font-size: 16px;
        }
        .page-link:hover {
            text-decoration: underline;
        }
        .post-text {
            color: #333333;
            margin-top: 6px;
            margin-bottom: 0;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>تغذية الأخبار المستخرجة (Feed)</h2>
    
    <div class="input-box">
        <input type="url" id="postUrl" placeholder="أدخل رابط منشور فيسبوك للتحليل..." required>
        <button onclick="extractNews()">استخراج</button>
    </div>

    <div id="feed" class="feed-container">
        <!-- تظهر النتائج هنا على شكل قائمة بالشكل المطلوب -->
    </div>
</div>

<script>
async function extractNews() {
    const urlInput = document.getElementById('postUrl').value;
    const feed = document.getElementById('feed');

    if (!urlInput) {
        alert('الرجاء إدخال رابط منشور أولاً');
        return;
    }

    const tempLoading = document.createElement('div');
    tempLoading.className = 'post-card';
    tempLoading.innerText = 'جاري استخراج بيانات المنشور...';
    feed.prepend(tempLoading);

    try {
        const response = await fetch('/extract', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urlInput })
        });

        const data = await response.json();
        feed.removeChild(tempLoading);

        if (data.status === 'success') {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.innerHTML = `<a href="${data.post_url}" target="_blank" class="page-link">${data.page_name}</a> : <span class="post-text">${data.post_text}</span>`;
            feed.prepend(card);
            document.getElementById('postUrl').value = '';
        } else {
            alert(data.message || 'حدث خطأ في استخراج الرابط');
        }
    } catch (err) {
        feed.removeChild(tempLoading);
        alert('تعذر الاتصال بالسيرفر حالياً');
    }
}
</script>

</body>
</html>

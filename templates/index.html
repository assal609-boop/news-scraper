<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مستخرج المنشورات</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        .container {
            width: min(1050px, 94%);
            margin: auto;
        }

        header {
            background: white;
            border-bottom: 1px solid #e7e7e7;
            padding: 18px 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            color: #222;
        }

        .logo span {
            color: #6c4cff;
        }

        main {
            padding: 45px 0 60px;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero h1 {
            margin: 0 0 10px;
            font-size: 34px;
            font-weight: 800;
        }

        .hero p {
            margin: 0;
            color: #777;
            font-size: 16px;
        }

        .input-card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
            border: 1px solid #ededed;
        }

        textarea {
            width: 100%;
            height: 145px;
            resize: vertical;
            border: 2px solid #e6e6e6;
            border-radius: 12px;
            padding: 15px;
            font-size: 15px;
            font-family: Arial, Tahoma, sans-serif;
            outline: none;
            direction: ltr;
            text-align: left;
            transition: 0.2s;
        }

        textarea:focus {
            border-color: #6c4cff;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 11px 14px;
            background: white;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .count {
            color: #777;
            font-size: 14px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .extract-btn {
            background: #6c4cff;
            color: white;
            min-width: 150px;
        }

        .extract-btn:hover {
            background: #5839df;
            transform: translateY(-1px);
        }

        .extract-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .copy-btn {
            background: #222;
            color: white;
        }

        .copy-btn:hover {
            background: #000;
        }

        .copy-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            text-align: center;
            font-size: 15px;
            min-height: 24px;
        }

        .results-section {
            margin-top: 30px;
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .results-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background: white;
            border: 1px solid #e7e7e7;
            border-radius: 13px;
            padding: 17px 19px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.04);
        }

        .result-line {
            font-size: 19px;
            line-height: 1.8;
            font-weight: 700;
            word-break: break-word;
        }

        .page-link {
            color: #5638d9;
            text-decoration: underline;
            font-weight: 800;
        }

        .page-link:hover {
            color: #3f25ae;
        }

        .colon {
            margin: 0 4px;
        }

        .post-text {
            color: #222;
            font-weight: 700;
        }

        .platform-label {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 9px;
            border-radius: 20px;
            background: #f1efff;
            color: #6045d9;
            font-size: 12px;
            font-weight: 700;
        }

        .error-card {
            border-right: 4px solid #e53935;
        }

        .error-text {
            color: #c62828;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 700;
        }

        .empty {
            background: white;
            border: 1px dashed #d5d5d5;
            border-radius: 13px;
            padding: 35px 20px;
            text-align: center;
            color: #888;
        }

        .loading {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 17px;
            height: 17px;
            border: 2px solid #ddd;
            border-top-color: #6c4cff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #222;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
            z-index: 9999;
            font-size: 14px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 700px) {

            main {
                padding: 30px 0 45px;
            }

            .hero h1 {
                font-size: 27px;
            }

            .hero p {
                font-size: 14px;
            }

            .input-card {
                padding: 15px;
            }

            textarea {
                height: 130px;
                font-size: 14px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .left-controls {
                width: 100%;
                justify-content: space-between;
            }

            .extract-btn {
                width: 100%;
            }

            .results-header {
                align-items: stretch;
            }

            .results-header .copy-btn {
                width: 100%;
            }

            .result-line {
                font-size: 17px;
                line-height: 1.75;
            }

            .logo {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="container header-content">
            <div class="logo">
                <span>مستخرج</span> المنشورات
            </div>
        </div>
    </header>


    <main>

        <div class="container">

            <section class="hero">

                <h1>استخراج منشورات التواصل الاجتماعي</h1>

                <p>
                    ضع روابط Facebook أو Instagram أو X لاستخراج محتوى المنشورات
                </p>

            </section>


            <section class="input-card">

                <textarea
                    id="urlInput"
                    placeholder="ضع الروابط هنا، كل رابط في سطر مستقل..."
                ></textarea>


                <div class="controls">

                    <div class="left-controls">

                        <select id="platformFilter">
                            <option value="all">كل المنصات</option>
                            <option value="facebook">Facebook</option>
                            <option value="instagram">Instagram</option>
                            <option value="x">X</option>
                        </select>

                        <span class="count">
                            عدد الروابط:
                            <strong id="linkCount">0</strong>
                        </span>

                    </div>


                    <button
                        id="extractBtn"
                        class="extract-btn"
                        onclick="extractPosts()"
                    >
                        استخراج المنشورات
                    </button>

                </div>

            </section>


            <div id="status" class="status"></div>


            <section
                id="resultsSection"
                class="results-section"
                style="display:none;"
            >

                <div class="results-header">

                    <h2>
                        النتائج
                        <span id="resultCount"></span>
                    </h2>

                    <button
                        id="copyBtn"
                        class="copy-btn"
                        onclick="copyResults()"
                        disabled
                    >
                        📋 نسخ النتائج
                    </button>

                </div>


                <div
                    id="resultsList"
                    class="results-list"
                ></div>

            </section>

        </div>

    </main>


    <div
        id="toast"
        class="toast"
    ></div>


    <script>

        let allResults = [];


        const urlInput =
            document.getElementById("urlInput");

        const linkCount =
            document.getElementById("linkCount");

        const platformFilter =
            document.getElementById("platformFilter");

        const resultsSection =
            document.getElementById("resultsSection");

        const resultsList =
            document.getElementById("resultsList");

        const resultCount =
            document.getElementById("resultCount");

        const copyBtn =
            document.getElementById("copyBtn");

        const extractBtn =
            document.getElementById("extractBtn");

        const status =
            document.getElementById("status");


        urlInput.addEventListener(
            "input",
            updateLinkCount
        );


        platformFilter.addEventListener(
            "change",
            renderResults
        );


        function updateLinkCount() {

            const urls = getInputUrls();

            linkCount.textContent = urls.length;
        }


        function getInputUrls() {

            return urlInput.value
                .split(/\r?\n/)
                .map(url => url.trim())
                .filter(Boolean);

        }


        function detectPlatform(item) {

            if (
                item &&
                item.platform
            ) {

                const platform =
                    String(item.platform).toLowerCase();

                if (
                    platform.includes("facebook")
                ) {
                    return "facebook";
                }

                if (
                    platform.includes("instagram")
                ) {
                    return "instagram";
                }

                if (
                    platform === "x" ||
                    platform.includes("twitter")
                ) {
                    return "x";
                }

            }


            const url =
                String(
                    item?.post_url || ""
                ).toLowerCase();


            if (
                url.includes("facebook.com") ||
                url.includes("fb.com")
            ) {
                return "facebook";
            }


            if (
                url.includes("instagram.com")
            ) {
                return "instagram";
            }


            if (
                url.includes("x.com") ||
                url.includes("twitter.com")
            ) {
                return "x";
            }


            return "unknown";
        }


        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function safeURL(value) {

            try {

                const url =
                    new URL(
                        String(value)
                    );

                if (
                    url.protocol === "http:" ||
                    url.protocol === "https:"
                ) {
                    return url.href;
                }

            } catch (error) {}

            return "#";
        }


        async function extractPosts() {

            const urls =
                getInputUrls();


            if (urls.length === 0) {

                showToast(
                    "أدخل رابطًا واحدًا على الأقل."
                );

                return;
            }


            extractBtn.disabled = true;

            copyBtn.disabled = true;


            status.innerHTML = `
                <div class="loading">
                    <span class="spinner"></span>
                    جاري استخراج المنشورات...
                </div>
            `;


            resultsSection.style.display =
                "none";


            try {

                const response =
                    await fetch(
                        "/extract",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                urls: urls
                            })
                        }
                    );


                const responseText =
                    await response.text();


                let data;


                try {

                    data =
                        JSON.parse(
                            responseText
                        );

                } catch (jsonError) {

                    throw new Error(
                        "الخادم أعاد استجابة غير صالحة."
                    );
                }


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.error ||
                        "حدث خطأ أثناء الاستخراج."
                    );
                }


                allResults =
                    Array.isArray(
                        data.results
                    )
                        ? data.results
                        : [];


                renderResults();


                resultsSection.style.display =
                    "block";


                status.innerHTML =
                    `تم استخراج ${data.successful || 0} من أصل ${data.total || allResults.length} رابط.`;


            } catch (error) {

                status.innerHTML =
                    `<span style="color:#c62828;font-weight:700;">
                        ❌ ${escapeHTML(error.message)}
                    </span>`;

                allResults = [];

                resultsList.innerHTML = "";

                resultCount.textContent = "";

                resultsSection.style.display =
                    "none";

            } finally {

                extractBtn.disabled = false;

            }

        }


        function renderResults() {

            const selectedPlatform =
                platformFilter.value;


            const filteredResults =
                allResults.filter(item => {

                    if (
                        selectedPlatform === "all"
                    ) {
                        return true;
                    }

                    return (
                        detectPlatform(item) ===
                        selectedPlatform
                    );

                });


            resultCount.textContent =
                `(${filteredResults.length})`;


            if (
                filteredResults.length === 0
            ) {

                resultsList.innerHTML = `
                    <div class="empty">
                        لا توجد نتائج لهذه المنصة.
                    </div>
                `;

                copyBtn.disabled = true;

                return;
            }


            resultsList.innerHTML =
                filteredResults.map(
                    (item) => {

                        const pageName =
                            escapeHTML(
                                item.page_name ||
                                "الحساب غير معروف"
                            );


                        const postText =
                            escapeHTML(
                                item.post_text ||
                                ""
                            );


                        const postURL =
                            safeURL(
                                item.post_url
                            );


                        if (item.error) {

                            return `
                                <div class="result-card error-card">

                                    <div class="result-line">

                                        <a
                                            class="page-link"
                                            href="${postURL}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >
                                            ${pageName}
                                        </a>

                                        <span class="colon">:</span>

                                        <span class="post-text">
                                            ${postText}
                                        </span>

                                    </div>

                                    <div class="error-text">
                                        ⚠️ ${escapeHTML(item.error)}
                                    </div>

                                </div>
                            `;

                        }


                        return `
                            <div class="result-card">

                                <div class="result-line">

                                    <a
                                        class="page-link"
                                        href="${postURL}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >
                                        ${pageName}
                                    </a>

                                    <span class="colon">:</span>

                                    <span class="post-text">
                                        ${postText}
                                    </span>

                                </div>

                            </div>
                        `;

                    }
                ).join("");


            copyBtn.disabled = false;

        }


        async function copyResults() {

            const selectedPlatform =
                platformFilter.value;


            const filteredResults =
                allResults.filter(item => {

                    if (
                        selectedPlatform === "all"
                    ) {
                        return true;
                    }

                    return (
                        detectPlatform(item) ===
                        selectedPlatform
                    );

                });


            if (
                filteredResults.length === 0
            ) {

                showToast(
                    "لا توجد نتائج لنسخها."
                );

                return;
            }


            /*
             * النسخ هنا للنتائج المستخرجة فقط.
             * لا يتم نسخ روابط الإدخال.
             *
             * الشكل:
             * اسم الصفحة: نص المنشور
             */

            const text =
                filteredResults
                    .map(item => {

                        const pageName =
                            item.page_name ||
                            "الحساب غير معروف";

                        const postText =
                            item.post_text ||
                            "";

                        return (
                            pageName +
                            ": " +
                            postText
                        );

                    })
                    .join("\n\n");


            try {

                await navigator.clipboard.writeText(
                    text
                );

                showToast(
                    "✅ تم نسخ النتائج بنجاح"
                );

            } catch (error) {

                /*
                 * طريقة احتياطية للأجهزة
                 * والمتصفحات التي تمنع Clipboard API.
                 */

                const temp =
                    document.createElement(
                        "textarea"
                    );

                temp.value = text;

                temp.style.position =
                    "fixed";

                temp.style.opacity = "0";

                document.body.appendChild(
                    temp
                );

                temp.focus();

                temp.select();

                try {

                    document.execCommand(
                        "copy"
                    );

                    showToast(
                        "✅ تم نسخ النتائج بنجاح"
                    );

                } catch (copyError) {

                    showToast(
                        "تعذر النسخ تلقائيًا."
                    );

                }

                document.body.removeChild(
                    temp
                );

            }

        }


        function showToast(message) {

            const toast =
                document.getElementById(
                    "toast"
                );


            toast.textContent =
                message;


            toast.classList.add(
                "show"
            );


            setTimeout(() => {

                toast.classList.remove(
                    "show"
                );

            }, 2500);

        }


        updateLinkCount();

    </script>

</body>

</html>

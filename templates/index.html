<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تفريغ منشورات السوشيال ميديا</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f4f7fb;
    color:#1f2937;
}

.container{
    width:min(1100px,94%);
    margin:40px auto;
}

.header{
    background:linear-gradient(135deg,#1877f2,#6c2bd9);
    color:#fff;
    padding:35px 25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    margin-bottom:25px;
}

.header h1{
    margin:0 0 10px;
    font-size:30px;
}

.header p{
    margin:0;
    opacity:.92;
    font-size:16px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
}

textarea{
    width:100%;
    min-height:180px;
    resize:vertical;
    border:2px solid #e2e8f0;
    border-radius:12px;
    padding:15px;
    font-size:15px;
    outline:none;
    direction:ltr;
    text-align:left;
}

textarea:focus{
    border-color:#1877f2;
    box-shadow:0 0 0 3px rgba(24,119,242,.1);
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.extract{
    background:#1877f2;
    color:#fff;
    flex:1;
}

.copy{
    background:#16a34a;
    color:#fff;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#status{
    margin-top:15px;
    display:none;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

.loading{
    display:block!important;
    background:#eff6ff;
    color:#1d4ed8;
}

.error{
    display:block!important;
    background:#fef2f2;
    color:#b91c1c;
}

.success{
    display:block!important;
    background:#f0fdf4;
    color:#15803d;
}

.results-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.results-header h2{
    margin:0;
    font-size:21px;
}

#results{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.result{
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:18px;
    background:#fff;
}

.result.ok{
    border-right:5px solid #16a34a;
}

.result.failed{
    border-right:5px solid #dc2626;
}

.result-line{
    display:flex;
    align-items:flex-start;
    gap:8px;
    line-height:1.9;
    flex-wrap:wrap;
}

.page-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:19px;
    font-weight:bold;
    color:#1877f2;
    text-decoration:none;
    margin:0;
}

.page-link:hover{
    text-decoration:underline;
    color:#0d47a1;
}

.platform{
    display:inline-block;
    font-size:12px;
    padding:5px 9px;
    border-radius:20px;
    background:#f1f5f9;
    color:#475569;
}

.separator{
    font-weight:bold;
    font-size:19px;
}

.post-inline{
    font-size:16px;
    white-space:pre-wrap;
    word-break:break-word;
    flex:1;
}

.field{
    margin-top:10px;
    line-height:1.8;
}

.field-title{
    font-weight:bold;
    color:#475569;
    margin-bottom:5px;
}

.post-text{
    white-space:pre-wrap;
    background:#f8fafc;
    border-radius:10px;
    padding:12px;
    line-height:1.9;
}

.empty{
    text-align:center;
    color:#64748b;
    padding:30px;
}

.number{
    display:inline-block;
    background:#1877f2;
    color:#fff;
    min-width:28px;
    height:28px;
    line-height:28px;
    text-align:center;
    border-radius:50%;
    font-size:13px;
}

@media(max-width:700px){

    .container{
        margin:20px auto;
    }

    .header h1{
        font-size:24px;
    }

    .buttons{
        flex-direction:column;
    }

    .copy{
        width:100%;
    }

    .result-line{
        display:block;
    }

    .result-line .number{
        margin-left:6px;
        vertical-align:middle;
    }

    .page-link{
        vertical-align:middle;
    }

    .separator{
        margin:0 5px;
    }

    .post-inline{
        display:inline;
    }

    .platform{
        margin-top:8px;
    }
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>📱 تفريغ منشورات السوشيال ميديا</h1>

<p>Facebook • Instagram • X / Twitter</p>

</div>


<div class="card">

<label>🔗 روابط المنشورات</label>

<textarea
id="links"
placeholder="ضع كل رابط في سطر منفصل

Facebook:
https://www.facebook.com/...

Instagram:
https://www.instagram.com/p/...

X:
https://x.com/.../status/..."></textarea>


<div class="buttons">

<button
id="extractBtn"
class="extract"
onclick="extractPosts()">

🔎 استخراج المنشورات

</button>

<button
id="copyBtn"
class="copy"
onclick="copyAll()">

📋 نسخ الكل

</button>

</div>


<div id="status"></div>

</div>


<div class="card">

<div class="results-header">

<h2>📋 النتائج</h2>

<span id="count"></span>

</div>


<div id="results">

<div class="empty">
لم يتم استخراج أي منشورات بعد.
</div>

</div>

</div>

</div>


<script>

let currentResults = [];


function escapeHTML(text){

    if(text === null || text === undefined)
        return "";

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function showStatus(message,type){

    const status = document.getElementById("status");

    status.className = type;

    status.textContent = message;
}


async function extractPosts(){

    const textarea =
        document.getElementById("links");

    const button =
        document.getElementById("extractBtn");

    const resultsBox =
        document.getElementById("results");

    const raw =
        textarea.value.trim();


    if(!raw){

        showStatus(
            "⚠️ ضع رابطًا واحدًا على الأقل.",
            "error"
        );

        return;
    }


    const links =
        raw
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(x => x.length > 0);


    button.disabled = true;

    button.textContent =
        "⏳ جاري الاستخراج...";


    resultsBox.innerHTML = "";


    showStatus(
        "⏳ جاري استخراج المنشورات...",
        "loading"
    );


    try{

        const response =
            await fetch(
                "/extract",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        urls:links.join("\n")
                    })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            data.status !== "success"
        ){

            throw new Error(
                data.message ||
                "الرابط غير صالح"
            );
        }


        currentResults =
            data.results || [];


        document.getElementById("count")
            .textContent =
            `${currentResults.length} نتيجة`;


        if(!currentResults.length){

            resultsBox.innerHTML =
                '<div class="empty">لم يتم العثور على نتائج.</div>';

        }else{

            currentResults.forEach(
                (item,index) => {

                    const div =
                        document.createElement("div");


                    if(item.success){

                        div.className =
                            "result ok";


                        div.innerHTML = `

                        <div class="result-line">

                            <span class="number">
                                ${index + 1}
                            </span>

                            <a
                                class="page-link"
                                href="${escapeHTML(item.post_url)}"
                                target="_blank"
                                rel="noopener noreferrer">

                                ${escapeHTML(item.page_name)}

                            </a>

                            <span class="separator">
                                :
                            </span>

                            <span class="post-inline">

                                ${escapeHTML(
                                    item.post_text ||
                                    "لا يوجد نص منشور ظاهر."
                                )}

                            </span>

                            <span class="platform">

                                ${escapeHTML(
                                    item.platform
                                )}

                            </span>

                        </div>

                        `;

                    }else{

                        div.className =
                            "result failed";


                        div.innerHTML = `

                        <div class="page-link">

                            <span class="number">
                                ${index + 1}
                            </span>

                            ❌ الرابط غير صالح

                        </div>

                        `;

                    }


                    resultsBox.appendChild(div);

                }
            );

        }


        showStatus(
            `✅ تم استخراج ${currentResults.length} نتيجة.`,
            "success"
        );


    }catch(error){

        currentResults = [];


        resultsBox.innerHTML = `

        <div class="empty">

            ❌ ${escapeHTML(
                error.message ||
                "الرابط غير صالح"
            )}

        </div>

        `;


        showStatus(
            "❌ " +
            (
                error.message ||
                "الرابط غير صالح"
            ),
            "error"
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "🔎 استخراج المنشورات";

    }

}


async function copyAll(){

    if(!currentResults.length){

        showStatus(
            "⚠️ استخرج النتائج أولًا.",
            "error"
        );

        return;
    }


    let output = "";


    currentResults.forEach(
        (item,index) => {

            output +=
                `${index + 1}. ` +
                `${item.page_name || "غير متوفر"} : ` +
                `${item.post_text || "غير متوفر"}\n\n`;

        }
    );


    try{

        await navigator.clipboard
            .writeText(output);


        showStatus(
            "✅ تم نسخ النتائج.",
            "success"
        );

    }catch(e){

        showStatus(
            "❌ تعذر النسخ.",
            "error"
        );

    }

}

</script>

</body>

</html>
